window.performReview=function(){openSheet(`<div class="title"><h2>回顾演绎</h2><button class="btn small" onclick="closeSheet()">关闭</button></div><div class="muted">已完成事件的回顾演绎，结果不可更改，只补完镜头。</div><textarea id="premise" class="editable" placeholder="例：从江清月的内心视角写。"></textarea><button class="btn full primary" style="margin-top:10px" onclick="mockPerform('review')">开始回顾</button>`)}
window.mockPerform=function(mode){const p=($('premise')?.value||'让 AI 自行接管。');const text=`${mode==='realtime'?'你踏入事件的边缘。':'回忆如月光铺开。'}${p}\n\n江清月立于寒月灵泉旁，衣袂无风自动。她没有立刻回头，只是以极轻的声音道：“临阳，修行之人，最忌心浮。”话音平静，却似乎藏着一丝只有她自己知道的克制。`;openSheet(`<div class="title"><h2>${mode==='realtime'?'实时演绎结果':'回顾演绎结果'}</h2><button class="btn small" onclick="closeSheet()">完成</button></div><div class="quote">${esc(text).replace(/\n/g,'<br>')}</div><button class="btn full primary" style="margin-top:12px" onclick="applyPerform('${mode}')">写入总结</button>`)}
window.applyPerform=function(mode){state.heroine.memories.unshift({type:'关于用户',text:'近日与临阳的接触让江清月再次意识到，九阴与九阳的牵引并非单纯灵力共鸣，必须更加克制。',weight:6});state.heroine.radar.心理好感=Math.min(10,state.heroine.radar.心理好感+1);state.heroine.radar.信任度=Math.min(10,state.heroine.radar.信任度+1);state.narration.unshift(`一次${mode==='realtime'?'实时':'回顾'}演绎结束，江清月的记忆出现了细微变化。`);save();closeSheet();render();toast('已写入记忆与数值变化')}
window.planNextEvent=function(){openSheet(`<div class="title"><h2>计划下一个事件</h2><button class="btn small" onclick="closeSheet()">关闭</button></div><textarea id="eventDesc" class="editable" placeholder="可选：描述你想让江清月接下来做什么。留空则随机。"></textarea><div class="actionBtns"><button class="btn primary" onclick="genEvent(false)">AI 随机</button><button class="btn" onclick="genEvent(true)">按描述生成</button></div>`)}
window.genEvent=function(byDesc){const d=($('eventDesc')?.value||'');state.heroine.event={title:byDesc?'自定义计划':'前往藏经阁',status:'计划中',place:byDesc?'由描述决定':'藏经阁',time:'辰时～午时',content:byDesc||'江清月将前往藏经阁查阅旧卷，确认护山阵异动是否与魔劫前兆有关。',result:'事件结束后返回宗主殿。'};save();closeSheet();renderCharacter();toast('已生成下一个事件')}
window.editCurrentEvent=function(){const e=state.heroine.event;openSheet(`<div class="title"><h2>编辑事件</h2><button class="btn small" onclick="closeSheet()">关闭</button></div><input id="et" class="input" value="${esc(e.title)}"><textarea id="ec" class="editable">${esc(e.content)}</textarea><button class="btn full primary" onclick="state.heroine.event.title=document.getElementById('et').value;state.heroine.event.content=document.getElementById('ec').value;save();closeSheet();renderCharacter()">保存</button>`)}
window.addNarration=function(){state.narration.unshift('山风掠过青岚宗的长阶，远处钟声沉缓。江清月的名字在弟子们低声议论中一闪而过，像冷月照入深潭。');save();renderMap()}
window.previewPrompt=function(){const prompt=buildPrompt();openSheet(`<div class="title"><h2>最终拼接预览</h2><button class="btn small" onclick="closeSheet()">关闭</button></div><textarea class="editable" style="min-height:420px">${esc(prompt)}</textarea>`)}
function buildPrompt(){return ['【提示词流】',...state.promptFlow.filter(p=>p.enabled).map(p=>`## ${p.name}\n${p.content}`),'【世界观条目】',...state.worldEntries.map(w=>`## ${w.title}（${w.type}）\n${w.content}`),'【用户角色】',`${state.user.name}\n${state.user.setting}`,'【江清月】',state.heroine.summary,JSON.stringify(state.heroine.profile,null,2),'【当前事件】',JSON.stringify(state.heroine.event,null,2)].join('\n\n')}
window.togglePrompt=i=>{state.promptFlow[i].enabled=!state.promptFlow[i].enabled;save();renderPrompts()};window.updatePrompt=(i,v)=>{state.promptFlow[i].content=v;save()};window.renamePrompt=i=>{const n=prompt('新名称',state.promptFlow[i].name);if(n){state.promptFlow[i].name=n;save();renderPrompts()}};window.movePrompt=(i,d)=>{const j=i+d;if(j<0||j>=state.promptFlow.length)return;[state.promptFlow[i],state.promptFlow[j]]=[state.promptFlow[j],state.promptFlow[i]];save();renderPrompts()};window.delPrompt=i=>{state.promptFlow.splice(i,1);save();renderPrompts()};window.addPrompt=()=>{state.promptFlow.push({name:'新提示词条目',enabled:true,content:'在这里输入提示词。'});save();renderPrompts()}
window.addWorldEntry=()=>{state.worldEntries.push({title:'新世界观条目',type:'设定',content:'填写设定内容。'});save();renderWorld()};window.editWorld=i=>{const w=state.worldEntries[i];openSheet(`<div class="title"><h2>编辑世界观</h2><button class="btn small" onclick="closeSheet()">关闭</button></div><input id="wt" class="input" value="${esc(w.title)}"><input id="wy" class="input" value="${esc(w.type)}" style="margin-top:8px"><textarea id="wc" class="editable">${esc(w.content)}</textarea><button class="btn full primary" onclick="state.worldEntries[${i}]={title:document.getElementById('wt').value,type:document.getElementById('wy').value,content:document.getElementById('wc').value};save();closeSheet();renderWorld()">保存</button>`)}
window.addMainline=()=>{state.mainline.push({date:'未定',title:'新主线节点',desc:'填写描述',locked:false});save();renderWorld()};window.editMainline=i=>{const n=state.mainline[i];openSheet(`<div class="title"><h2>编辑主线</h2><button class="btn small" onclick="closeSheet()">关闭</button></div><input id="md" class="input" value="${esc(n.date)}"><input id="mt" class="input" value="${esc(n.title)}" style="margin-top:8px"><textarea id="mc" class="editable">${esc(n.desc)}</textarea><button class="btn full primary" onclick="state.mainline[${i}].date=document.getElementById('md').value;state.mainline[${i}].title=document.getElementById('mt').value;state.mainline[${i}].desc=document.getElementById('mc').value;save();closeSheet();renderWorld()">保存</button>`)}
window.editHeroProfile=k=>{const v=prompt('编辑 '+labelProfile(k),state.heroine.profile[k]);if(v!==null){state.heroine.profile[k]=v;save();renderCharacter()}};window.removeOutfit=i=>{state.heroine.outfit.splice(i,1);save();renderCharacter()};window.addOutfit=()=>{state.heroine.outfit.push({name:'新服饰',tags:['自定义'],description:'填写客观描述。'});save();renderCharacter()};window.addMemory=()=>{state.heroine.memories.unshift({type:'手动记忆',text:'新的记忆。',weight:3});save();renderCharacter()}
window.testApi=()=>toast(state.api.key?'API 配置已填写，真实调用后续接入。':'未填写 API Key，当前使用本地模拟。');window.resetData=()=>{if(confirm('重置所有本地数据？')){localStorage.removeItem(LS);state=structuredClone(defaultState);save();render();toast('已重置')}};
render();
</script>
</body>
</html>
